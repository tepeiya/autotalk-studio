name: Welcome New Contributor

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            感谢你提交 Issue！我们会尽快查看。
            如果是 Bug，请补上复现步骤和日志；如果是功能请求，请说明使用场景。
          pr-message: |
            感谢你的首个 PR！CI 跑完后我们会 review。
            如果是新功能，请确认已在 `backend/tests/` 或 `frontend` 补充测试。
